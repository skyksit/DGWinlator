apply plugin: 'com.android.application'

// GameLaunchActivity only accepts callers signed with our certificate, so debug builds have to be
// signed with the same keystore DGPlayer uses or the bridge rejects it. Point local.properties at it:
//   dgp.debug.keystore=D:/studyspace/dgplayer-app/dsam3/debug.keystore
// Left unset, this falls back to the stock Android debug key and only adb launches will work.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def dgpDebugKeystore = null
def dgpDebugKeystorePath = localProps.getProperty('dgp.debug.keystore')
if (dgpDebugKeystorePath != null && !dgpDebugKeystorePath.trim().isEmpty()) {
    def candidate = file(dgpDebugKeystorePath.trim())
    if (candidate.exists()) dgpDebugKeystore = candidate
    else logger.warn("dgp.debug.keystore points at a missing file: ${candidate}")
}

android {
    compileSdk 34

    defaultConfig {
        // Must stay exactly 12 bytes long, same as upstream's 'com.winlator'. The prebuilt rootfs
        // is not relocatable: every glibc binary in it (box64, wine, wineserver, ...) has its ELF
        // interpreter hardcoded to /data/data/<applicationId>/files/rootfs/lib/ld-linux-aarch64.so.1,
        // and ld.so.cache plus several configs embed the same prefix. All shipped .tzst assets have
        // been binary-patched com.winlator -> com.dgplayer via scripts/patch_tzst.py (root repo);
        // the same-length substitution keeps every offset-based structure valid. Any future rename
        // must rerun that script (and keep the 12-byte length) or regenerate the rootfs.
        //
        // Consequence: this fork now coexists with stock Winlator instead of replacing it.
        applicationId 'com.dgplayer'
        minSdkVersion 26
        // Must stay 28. Winlator execve()s proot/box64/wine out of filesDir, which Android 10+
        // (targetSdk 29+) blocks as a W^X violation. This is a functional requirement, not laziness.
        targetSdkVersion 28
        versionCode 28
        versionName "11.1"
    }

    // Release builds are signed with the same key dsam3/retrople releases use
    // (~/.android/skyksit.keystore), so GameLaunchActivity's signature check accepts bridge
    // launches from the release DGPlayer. This repo is public, so the credentials must never
    // be hardcoded here: CI injects everything via DGW_* environment variables, and local
    // builds fall back to the shared keystore with credentials read from local.properties
    // (gitignored):
    //   dgw.release.storePassword=...
    //   dgw.release.keyPassword=...   (defaults to storePassword)
    //   dgw.release.keyAlias=...      (defaults to 'skyksit')
    def releaseStoreFile = null
    def releaseStorePassword = System.getenv('DGW_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('DGW_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('DGW_KEY_PASSWORD')

    def envKeystorePath = System.getenv('DGW_KEYSTORE_FILE')
    if (envKeystorePath != null && !envKeystorePath.trim().isEmpty()) {
        releaseStoreFile = file(envKeystorePath.trim())
    } else {
        def sharedKeystore = new File(System.getProperty('user.home'), '.android/skyksit.keystore')
        if (sharedKeystore.exists()) {
            releaseStoreFile = sharedKeystore
            if (releaseStorePassword == null) releaseStorePassword = localProps.getProperty('dgw.release.storePassword')
            if (releaseKeyAlias == null) releaseKeyAlias = localProps.getProperty('dgw.release.keyAlias', 'skyksit')
            if (releaseKeyPassword == null) releaseKeyPassword = localProps.getProperty('dgw.release.keyPassword', releaseStorePassword)
        }
    }
    def releaseSigningReady = releaseStoreFile != null && releaseStorePassword != null &&
            releaseKeyAlias != null && releaseKeyPassword != null
    if (releaseStoreFile != null && !releaseSigningReady) {
        logger.warn('Release keystore found but credentials are missing - release APK will be unsigned. ' +
                'Set dgw.release.storePassword in local.properties or the DGW_* environment variables.')
    }

    signingConfigs {
        debug {
            if (dgpDebugKeystore != null) {
                storeFile dgpDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (releaseSigningReady) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    // midihandler/CMakeLists.txt declares the prebuilt jniLibs as SHARED IMPORTED targets, so
    // CMake stages its own copy of each one next to the merged jniLibs output and the merge task
    // aborts on the duplicate. Both copies are the same file, so first-wins is the right call.
    // https://developer.android.com/r/tools/jniLibs-vs-imported-targets
    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'lib/**/libFLAC.so'
        pickFirst 'lib/**/libfluidsynth.so'
        pickFirst 'lib/**/libfluidsynth-assetloader.so'
        pickFirst 'lib/**/libgio-2.0.so'
        pickFirst 'lib/**/libglib-2.0.so'
        pickFirst 'lib/**/libgmodule-2.0.so'
        pickFirst 'lib/**/libgobject-2.0.so'
        pickFirst 'lib/**/libgthread-2.0.so'
        pickFirst 'lib/**/libinstpatch-1.0.so'
        pickFirst 'lib/**/liboboe.so'
        pickFirst 'lib/**/libogg.so'
        pickFirst 'lib/**/libopus.so'
        pickFirst 'lib/**/libpcre.so'
        pickFirst 'lib/**/libpcreposix.so'
        pickFirst 'lib/**/libsndfile.so'
        pickFirst 'lib/**/libvorbis.so'
        pickFirst 'lib/**/libvorbisenc.so'
        pickFirst 'lib/**/libvorbisfile.so'
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
